{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}My Store{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="{% static 'store/store_cp.css' %}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-light">
    <div class="site-header py-2 px-3 d-flex align-items-center">
      <button
        class="btn border-0 bg-transparent me-3"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-label="Open menu"
      >
        <h4 class="text-white"><i class="bi bi-shop-window me-2 text-white"></i>My Store</h4>
      </button>
     <form class="d-flex ms-auto me-3" method="GET" action="">
    <div class="d-flex align-items-center border rounded-pill bg-white overflow-hidden">
        <input type="search" name="q" value="{{ request.GET.q }}"
               placeholder="Search products"
               class="form-control border-0 shadow-none ps-3">
        <button class="btn border-0 bg-transparent shadow-none" type="submit"
                aria-label="Search">
            <i class="bi bi-search"></i>
        </button>
    </div>
</form>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mainNav">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title">
          <i class="bi bi-shop-window me-2"></i>My Store
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link text-dark" href="{% url 'product_list' %}">
              <i class="bi bi-grid me-2"></i>Products
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="{% url 'add_product' %}">
              <i class="bi bi-plus-circle me-2"></i>Add Product
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="{% url 'add_category' %}">
              <i class="bi bi-tag me-2"></i>Add Category
            </a>
          </li>
        </ul>
      </div>
    </div>

    <main class="container my-4">
      {% block content %} 
      {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
